<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Isometric Cube -->
  <!-- Top Face -->
  <polygon points="16,3 28,10 16,17 4,10" fill="#22c55e"/>
  <!-- Left Face -->
  <polygon points="4,10 16,17 16,29 4,22" fill="#16a34a"/>
  <!-- Right Face -->
  <polygon points="16,17 28,10 28,22 16,29" fill="#15803d"/>
  <!-- Subtle Grid Accent -->
  <line x1="16" y1="3" x2="16" y2="17" stroke="#86efac" stroke-width="0.5" stroke-opacity="0.6"/>
  <line x1="4" y1="10" x2="28" y2="10" stroke="#86efac" stroke-width="0.5" stroke-opacity="0.6"/>
</svg>
