[workspace]
resolver = "3"
members = [
  "crates/nbt",
  "crates/scene",
  "crates/litematic",
  "crates/mesh",
  "crates/material",
  "crates/render",
  "crates/cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
png = "0.17"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.dev]
# Disables debuginfo to improve dev and test compile and link times.
debug = false
