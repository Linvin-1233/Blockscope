[package]
name = "blockscope-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Command-line interface for rendering Minecraft .litematic files to PNG, MP4, and GIF."
keywords = ["minecraft", "litematic", "renderer", "cli"]
categories = ["command-line-utilities", "games"]

[[bin]]
name = "blockscope"
path = "src/main.rs"

[features]
default = []
# Opt-in offscreen wgpu rasterizer (`--backend gpu`). Binaries built with this
# feature still default to the CPU backend.
gpu = ["blockscope-render/gpu"]

[dependencies]
anstream.workspace = true
anstyle.workspace = true
clap.workspace = true
console.workspace = true
indicatif.workspace = true
blockscope-core = { path = "../litematic", version = "0.6.0" }
blockscope-material = { path = "../material", version = "0.6.0" }
blockscope-mesh = { path = "../mesh", version = "0.6.0" }
blockscope-render = { path = "../render", version = "0.6.0" }
blockscope-scene = { path = "../scene", version = "0.6.0" }
blockscope-video = { path = "../video", version = "0.6.0" }
serde_json.workspace = true
serde.workspace = true

[dev-dependencies]
png.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
