[package]
name = "litematic-render"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Deterministic rasterizer and PNG output for Blockscope scenes."
keywords = ["minecraft", "litematic", "renderer", "png"]
categories = ["games", "graphics", "rendering"]

[features]
default = []
# Offscreen wgpu rasterizer. Disabled by default so deployments that only need
# the CPU path do not link GPU drivers.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
bytemuck = { workspace = true, optional = true }
litematic-material = { path = "../material", version = "0.5.0" }
litematic-mesh = { path = "../mesh", version = "0.5.0" }
litematic-scene = { path = "../scene", version = "0.5.0" }
png.workspace = true
pollster = { workspace = true, optional = true }
serde.workspace = true
tempfile.workspace = true
wgpu = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
