[package]
name = "litematic-render"
version.workspace = true
edition.workspace = true

[features]
default = []
# Offscreen wgpu rasterizer. Disabled by default so deployments that only need
# the CPU path do not link GPU drivers.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
bytemuck = { workspace = true, optional = true }
litematic-material = { path = "../material" }
litematic-mesh = { path = "../mesh" }
litematic-scene = { path = "../scene" }
png.workspace = true
pollster = { workspace = true, optional = true }
serde.workspace = true
tempfile.workspace = true
wgpu = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
