name: release

# Tag push creates the GitHub Release and uploads binaries.
# Manual dispatch only builds and packages, so the workflow can be verified
# before the first tag exists.
on:
  push:
    tags:
      - "v[0-9]+.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create_release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Verify tag matches the workspace version
        run: just verify-tag "${{ github.ref_name }}"
      # Fails when CHANGELOG.md has no section for this version, so a release
      # always carries curated notes instead of an empty body.
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md

  upload_assets:
    needs: create_release
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.create_release.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            # Link the static CRT so the executable runs without the
            # Visual C++ redistributable.
            rustflags: -C target-feature=+crt-static
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: blockscope
          package: blockscope-cli
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          tar: unix
          zip: windows
          include: README.md
          leading-dir: true
          checksum: sha256
          locked: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      # The upload action already built the binary for this target, so the MSI
      # packages the same executable that ships in the zip.
      - uses: taiki-e/install-action@v2
        if: matrix.target == 'x86_64-pc-windows-msvc' && github.event_name == 'push'
        with:
          tool: just
      - name: Build and upload MSI
        if: matrix.target == 'x86_64-pc-windows-msvc' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: just release-msi "${{ github.ref_name }}"
