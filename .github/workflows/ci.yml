name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t blockscope:ci .
      - name: capacity inside a 1 CPU / 1 GiB container
        run: docker run --rm --cpus=1 --memory=1g blockscope:ci capacity --json
      - name: protocol smoke test
        run: |
          printf '%s\n' '{"type":"shutdown"}' |
            docker run --rm -i --cpus=1 --memory=1g blockscope:ci serve

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p blockscope-cli --bin blockscope
      - name: Build MSI
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$').Matches[0].Groups[1].Value
          ./scripts/build-msi.ps1 -Version $version -BinDir target/release -Output out/blockscope-msi-check.msi
      - uses: actions/upload-artifact@v4
        with:
          name: blockscope-msi
          path: out/blockscope-msi-check.msi

